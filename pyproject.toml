[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poetry-asr"
version = "2.0.0"
description = "古诗词语音识别与时间对齐系统 - 基于 Whisper 的端到端语音识别桌面应用"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "PoetryASR Contributors" }]
keywords = ["speech-recognition", "whisper", "poetry", "pypinyin", "gradio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "openai-whisper>=20231117",
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "soundfile>=0.12.0",
    "pyyaml>=6.0",
    "pypinyin>=0.49.0",
    "zhconv>=1.4.0",
    "gradio>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
mimo = ["openai>=1.0.0"]
realtime = ["pyaudio>=0.2.13"]
all = ["poetry-asr[dev,mimo,realtime]"]

[project.scripts]
poetry-asr = "launcher:main"

[project.urls]
Homepage = "https://github.com/xiaomaaimanbo/PoetryASR"
Issues = "https://github.com/xiaomaaimanbo/PoetryASR/issues"

[tool.setuptools.packages.find]
include = ["src*", "launcher*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
